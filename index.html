// ── Utilities ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// ── Wake Lock ──────────────────────────────────────────────────────────────────
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch(e) {}
}
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && running) await acquireWakeLock();
});

// ── Web Worker timer ───────────────────────────────────────────────────────────
function createWorker() {
  const blob = new Blob([`
    self.onmessage = function(e) {
      const ms = e.data;
      let remaining = ms;
      const iv = setInterval(() => {
        remaining -= 1000;
        self.postMessage(remaining);
        if (remaining <= 0) clearInterval(iv);
      }, 1000);
    };
  `], { type: 'application/javascript' });
  return new Worker(URL.createObjectURL(blob));
}

function workerSleep(secs, onTick) {
  return new Promise(resolve => {
    const w = createWorker();
    w.onmessage = e => {
      if (e.data <= 0) { w.terminate(); resolve(); }
      else { onTick(Math.ceil(e.data / 1000)); }
    };
    w.postMessage(secs * 1000);
  });
}

// ── Run builder ────────────────────────────────────────────────────────────────
function buildRun() {
  const catKeys  = shuffle(Object.keys(CATEGORIES)).slice(0, 2);
  const run = [];
  for (const cat of catKeys) {
    const subs = shuffle(Object.keys(CATEGORIES[cat])).slice(0, 3);
    for (const sub of subs) {
      const searches = shuffle(CATEGORIES[cat][sub]).slice(0, randInt(5, 6));
      run.push({ category: cat, subcategory: sub, searches });
    }
  }
  return run;
}

// ── UI helpers ─────────────────────────────────────────────────────────────────
function log(msg, done) {
  const el = document.getElementById("log");
  const span = document.createElement("span");
  if (done) span.className = "done-entry";
  span.textContent = msg;
  el.prepend(span);
}

function setCountdown(secs) {
  document.getElementById("countdown").textContent =
    secs > 0 ? `Next in ${Math.floor(secs/60) > 0 ? Math.floor(secs/60)+'m ' : ''}${secs%60}s` : "";
}

// ── Main loop ──────────────────────────────────────────────────────────────────
let running = false;

async function start() {
  if (running) return;
  running = true;
  document.getElementById("startBtn").disabled = true;
  document.getElementById("doneMsg").textContent = "";
  document.getElementById("log").innerHTML = "";
  document.getElementById("categoryLabel").textContent = "";
  document.getElementById("topic").textContent = "";

  await acquireWakeLock();

  const run     = buildRun();
  const total   = run.reduce((s, g) => s + g.searches.length, 0);
  let   current = 0;

  const frame = document.getElementById("searchFrame");

  for (let gi = 0; gi < run.length; gi++) {
    const group = run[gi];
    for (let si = 0; si < group.searches.length; si++) {
      const query = group.searches[si];
      current++;

      document.getElementById("status").textContent = `Search ${current} / ${total}`;
      document.getElementById("categoryLabel").textContent = `${group.category}  ›  ${group.subcategory}`;
      document.getElementById("topic").textContent = query;
      document.getElementById("progressFill").style.width = ((current / total) * 100) + "%";

      const url = "https://www.bing.com/search?q=" + encodeURIComponent(query) +
                  "&cc=xl&PC=SANSAAND&form=LWS001&ssp=1&safesearch=moderate&setlang=en-gb";
      frame.src = url;
      log(`[${current}/${total}] ${group.category} › ${group.subcategory}: ${query}`);

      const isLastInGroup  = si === group.searches.length - 1;
      const isLastOverall  = current === total;

      if (!isLastOverall) {
        const delay = isLastInGroup ? randInt(45, 180) : randInt(5, 30);
        await workerSleep(delay, setCountdown);
        setCountdown(0);
      }
    }
  }

  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("status").textContent  = `Done — ${total} searches completed`;
  document.getElementById("categoryLabel").textContent = "";
  document.getElementById("topic").textContent   = "";
  document.getElementById("countdown").textContent = "";
  document.getElementById("doneMsg").textContent = "✓ Come back tomorrow!";
  document.getElementById("startBtn").disabled   = false;
  log(`--- Run complete: ${total} searches ---`, true);
  releaseWakeLock();
  running = false;
}
</script>
